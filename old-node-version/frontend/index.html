<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaveWise - Dashboard</title>
  <style>
    body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; background-color: #f4f7f6; color: #333; }
    header { background-color: #2c3e50; color: white; padding: 1rem; text-align: center; }
    .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
    .card { background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 1rem; }
    h1, h2 { color: #2c3e50; }
    .btn { background-color: #27ae60; color: white; padding: 0.5rem 1rem; border: none; border-radius: 4px; cursor: pointer; }
    .btn:hover { background-color: #219653; }
    #logoutBtn { background-color: #e74c3c; float: right; }
  </style>
</head>
<body>
  <header>
    <h2>SaveWise Dashboard <button id="logoutBtn" class="btn">Logout</button></h2>
  </header>
  <div class="container">
    <div class="card">
      <h2>Welcome back!</h2>
      <p>Your financial summary will appear here.</p>
      <div style="display: flex; gap: 1rem; margin-top: 1rem;">
        <div class="card" style="flex: 1; background: #e8f5e9;">
          <h3>Total Income</h3>
          <h2 id="totalIncome">₹0</h2>
        </div>
        <div class="card" style="flex: 1; background: #ffebee;">
          <h3>Total Expenses</h3>
          <h2 id="totalExpenses">₹0</h2>
        </div>
        <div class="card" style="flex: 1; background: #e3f2fd;">
          <h3>Current Balance</h3>
          <h2 id="currentBalance">₹0</h2>
        </div>
      </div>
    </div>
  </div>
  <script>
    // Basic Auth Check
    if (!localStorage.getItem('token')) {
      window.location.href = '/login.html';
    }
    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('token');
      window.location.href = '/login.html';
    });
  </script>
</body>
</html>
